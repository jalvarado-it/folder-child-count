version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node versions track the Node.js major; this project targets
      # Node 24 (see engines, .nvmrc and the CI node-version), so skip majors.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
